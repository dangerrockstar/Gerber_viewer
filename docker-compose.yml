version: "3.8"

services:
  app:
    build: .
    volumes:
      - .:/workspace
      - build_data:/workspace/build
    environment:
      DISPLAY: host.docker.internal:0
      XDG_RUNTIME_DIR: /tmp/runtime-root
    shm_size: 1g
    tty: true
    stdin_open: true
    command: bash -lc "mkdir -p build && cd build && qmake .. && make -j$$(nproc) && ./geber_app"

volumes:
  build_data:
